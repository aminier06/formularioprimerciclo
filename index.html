<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario Primer Ciclo</title>

<style>
body { font-family: Arial; padding: 20px; }
input, select { display: block; margin-bottom: 10px; padding: 8px; width: 320px; }
.ok { color: green; font-weight: bold; }
.error { color: red; font-weight: bold; }
</style>
</head>

<body>

<h2>Formulario Primer Ciclo</h2>

<label>Código SIGERD</label>
<input type="text" id="sigerd" maxlength="5">
<div id="status"></div>

<label>Centro</label>
<input type="text" id="centro" readonly>

<label>Regional</label>
<input type="text" id="regional" readonly>

<label>Distrito</label>
<input type="text" id="distrito" readonly>

<label>Sector</label>
<input type="text" id="sector" readonly>

<hr>

<label>Matrícula</label>
<input type="number" id="matricula">

<label>Indicador</label>
<input type="number" id="indicador">

<button onclick="enviar()">Enviar</button>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymXsGKDFwkkFa0TtM4NX6YSNDrRwukIaA7kF5AWJm38T5FgzRIrO1X-uja56WVcg8W/exec";

/* =========================
   AUTOCOMPLETADO
========================= */
document.getElementById("sigerd").addEventListener("input", async function () {

  const codigo = this.value.trim();
  const status = document.getElementById("status");

  if (!/^\d{5}$/.test(codigo)) {
    limpiar();
    status.innerHTML = "<span class='error'>Código inválido</span>";
    return;
  }

  status.innerHTML = "Buscando...";

  try {
    const response = await fetch(SCRIPT_URL + "?codigo=" + codigo);
    const result = await response.json();

    if (result.status === "success") {

      document.getElementById("centro").value = result.data.centro;
      document.getElementById("regional").value = result.data.regional;
      document.getElementById("distrito").value = result.data.distrito;
      document.getElementById("sector").value = result.data.sector;

      status.innerHTML = "<span class='ok'>Centro encontrado</span>";

    } else {
      limpiar();
      status.innerHTML = "<span class='error'>Centro no encontrado</span>";
    }

  } catch (error) {
    limpiar();
    status.innerHTML = "<span class='error'>Error al consultar</span>";
    console.error(error);
  }

});

function limpiar() {
  document.getElementById("centro").value = "";
  document.getElementById("regional").value = "";
  document.getElementById("distrito").value = "";
  document.getElementById("sector").value = "";
}

/* =========================
   ENVÍO
========================= */
async function enviar() {

  const codigo = document.getElementById("sigerd").value.trim();
  const centro = document.getElementById("centro").value;

  if (!/^\d{5}$/.test(codigo)) {
    alert("Código SIGERD inválido");
    return;
  }

  if (!centro) {
    alert("Debe seleccionar un centro válido");
    return;
  }

  const data = {
    codigo: codigo,
    centro: centro,
    regional: document.getElementById("regional").value,
    distrito: document.getElementById("distrito").value,
    sector: document.getElementById("sector").value,
    matricula: document.getElementById("matricula").value,
    indicador: document.getElementById("indicador").value
  };

  try {

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    alert("CENTRO REGISTRADO CORRECTAMENTE.");

    document.querySelectorAll("input").forEach(i => i.value = "");
    document.getElementById("status").innerHTML = "";

  } catch (error) {
    alert("Error al enviar");
    console.error(error);
  }

}

</script>

</body>
</html>
